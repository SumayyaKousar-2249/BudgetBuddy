# ═══════════════════════════════════════════════════════════════════════════════
# BASE APPLICATION CONFIG
# For local development the "local" profile is active by default.
# To switch to production, set: spring.profiles.active=prod
# ═══════════════════════════════════════════════════════════════════════════════

spring.profiles.active=local

spring.main.allow-circular-references=true

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwtExpirationMs=86400000

# ── Verification code expiry (14 minutes in ms) ───────────────────────────────
app.verificationCodeExpirationMs=840000

# ── File uploads ──────────────────────────────────────────────────────────────
app.user.profile.upload.dir=./uploads/user/profile

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Mail defaults (overridden per profile) ────────────────────────────────────
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8082
