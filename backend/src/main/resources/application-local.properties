# ═══════════════════════════════════════════════════════════════════════════════
# LOCAL DEVELOPMENT PROFILE  (spring.profiles.active=local)
# ═══════════════════════════════════════════════════════════════════════════════
# This file is merged on top of application.properties when the "local" Spring
# profile is active. It overrides any value that requires real infrastructure.
# ─────────────────────────────────────────────────────────────────────────────

# ── Database ──────────────────────────────────────────────────────────────────
# Change the password below if your MySQL root password is different from "root"
spring.datasource.url=jdbc:mysql://localhost:3306/expensetracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# ── JWT ───────────────────────────────────────────────────────────────────────
# Base64-encoded 256-bit key  (≥32 bytes required for HS256)
app.jwtSecret=dGhpc0lzQVNlY3VyZUxvY2FsRGV2U2VjcmV0S2V5Rm9yRXhwZW5zZVRyYWNrZXIxMjM0NTY3OA==

# ── Mail — stubbed in local profile (DevEmailNotificationService is used) ─────
# These values are not actually used in local mode because DevEmailNotificationService
# replaces the real mail service. They must still be present to satisfy Spring's
# auto-configuration binding.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=dev@localhost
spring.mail.password=unused
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── Logging — show verification codes in console ──────────────────────────────
logging.level.com.fullStack.expenseTracker.services.impls.DevEmailNotificationService=INFO
logging.level.com.fullStack=DEBUG
